# "Worker scaling" — a separate Deployment from api, scaled
# independently, since job load (image processing, AI analysis, bulk
# WhatsApp sends) doesn't correlate with API request volume the way
# api's own replica count should. No Service — this process only
# consumes from BullMQ queues (Prompt 44), it never listens for HTTP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bcp-worker
  namespace: bcp-studio-os
  labels:
    app: bcp-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bcp-worker
  template:
    metadata:
      labels:
        app: bcp-worker
    spec:
      containers:
        - name: worker
          image: ${CONTAINER_REGISTRY}/bcp-worker:latest
          envFrom:
            - configMapRef:
                name: bcp-config
            - secretRef:
                name: bcp-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2" # image processing (sharp) is CPU-heavier per job than a typical API request
              memory: "1Gi"
---
# BullMQ has no HTTP endpoint to scrape for queue depth out of the box, so this HPA scales on CPU as
# a starting point. A production deployment should replace/augment this with a custom-metrics HPA
# driven by actual queue depth (e.g. via KEDA's BullMQ scaler) — the honest next step, not yet wired.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bcp-worker-hpa
  namespace: bcp-studio-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bcp-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
