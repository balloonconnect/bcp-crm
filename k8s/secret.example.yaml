# Template only — never commit a real filled-in Secret to version control.
# Apply the real one via `kubectl apply -f secret.yaml` (gitignored) or, better,
# via your cluster's external-secrets operator pulling from a real secret
# manager (see docs/secret-management.md).
apiVersion: v1
kind: Secret
metadata:
  name: bcp-secrets
  namespace: bcp-studio-os
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@host:5432/bcp_studio_os"
  REDIS_URL: "redis://host:6379"
  S3_ENDPOINT: "https://s3.amazonaws.com"
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_BUCKET: ""
  ANTHROPIC_API_KEY: ""
  WHATSAPP_ACCESS_TOKEN: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  BACKUP_ENCRYPTION_KEY: ""
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  JWT_SIGNING_KEY: ""
