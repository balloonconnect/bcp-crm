name: bcp-studio-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: bcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bcp
      POSTGRES_PASSWORD: bcp_dev_password
      POSTGRES_DB: bcp_studio_os
    ports:
      - "5432:5432"
    volumes:
      - bcp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcp -d bcp_studio_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bcp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bcp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bcp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bcp_minio_admin
      MINIO_ROOT_PASSWORD: bcp_minio_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - bcp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: bcp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bcp_minio_admin bcp_minio_password &&
      mc mb --ignore-existing local/bcp-studio-os-dev &&
      mc anonymous set download local/bcp-studio-os-dev
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: bcp-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bcp_postgres_data:
  bcp_redis_data:
  bcp_minio_data:
